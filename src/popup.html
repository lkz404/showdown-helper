<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Showdown Helper</title>
<meta name="description" content="Import your team from a Pokepaste so the Showdown Helper panel calculates damage against your real stats.">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <h1>Showdown Helper</h1>
  </header>
  <main class="sheet">
    <p class="intro">Import your team from a Pokepaste so damage uses your real stats.</p>
    <form id="form">
      <label class="field-label" for="url">Pokepaste link</label>
      <div class="entry">
        <input id="url" type="url" placeholder="https://pokepast.es/…" aria-label="Pokepaste link" autocomplete="off">
        <button id="go" type="submit">Import</button>
      </div>
      <div id="msg" role="status"></div>
    </form>
    <section id="team" hidden>
      <h2>Imported team</h2>
      <ol id="list"></ol>
      <button id="clear" class="link" type="button">Remove imported team</button>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
